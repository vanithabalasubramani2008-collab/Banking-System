# H2 In-Memory Database for Unit & Integration Testing
spring.datasource.url=jdbc:h2:mem:securebank_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.sql.init.mode=never

# Test JWT Secret
app.jwt.secret=TestSecretKeySecureBankTestingPurposeOnly32BytesOrLongerRequired!
app.jwt.expiration-ms=3600000
